[project]
name = "tally"
version = "0.1.0"
description = "Tally - a friendly local AI data analyst. Drop in a spreadsheet, get the story."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tally"]

[tool.setuptools.package-data]
tally = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
